# Local development Nginx config — HTTP only, no SSL
# Usage: copy to nginx/nginx.conf when developing locally
# Access: http://localhost → admin UI, http://localhost/api → backend

server {
    listen 80;
    server_name localhost;

    client_max_body_size 2048m;

    # Use Docker's internal DNS so nginx re-resolves container IPs after container restarts.
    # The variable trick (set $var) is required — static proxy_pass caches DNS forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → FastAPI backend (strip /api/ prefix via rewrite)
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Webhook passthrough (keep /webhook/ prefix)
    location /webhook/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }

    # Admin UI — variable without trailing slash passes full URI unchanged
    location / {
        set $admin http://admin:3000;
        proxy_pass         $admin;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
    }
}
