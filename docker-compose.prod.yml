# Production overrides for Oracle Cloud VM (2 OCPU, 8GB RAM)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file only changes what is different from docker-compose.yml:
# - Removes dev code bind-mounts where code is baked into images
# - Scales gunicorn to 2 workers
# - Locks down DB/Redis ports
# - Adds memory limits

services:
  db:
    ports: []

  redis:
    ports: []

  backend:
    volumes:
      - ./backups:/app/backups
    command: >
      gunicorn backend.main:app
      -k uvicorn.workers.UvicornWorker
      -w 2
      --bind 0.0.0.0:8000
      --timeout 1800
      --graceful-timeout 60
      --log-level info
    deploy:
      resources:
        limits:
          memory: 2g

  worker:
    volumes:
      - ./backups:/app/backups
    environment:
      WORKER_CONCURRENCY: "8"
      WORKER_POLL_INTERVAL: "0.5"
    deploy:
      resources:
        limits:
          memory: 512m

  admin:
    deploy:
      resources:
        limits:
          memory: 128m
