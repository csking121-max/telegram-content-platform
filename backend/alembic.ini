[alembic]
script_location = migrations
version_locations = %(script_location)s/versions
# sqlalchemy.url is set programmatically in migrations/env.py using the
# DATABASE_URL_SYNC environment variable.  Ensure this env var is set before
# running: alembic upgrade head
# Example: DATABASE_URL_SYNC=postgresql://user:pass@localhost:5432/dbname
# sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = []
level = DEBUG
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(message)s
datefmt = %Y-%m-%d %H:%M:%S